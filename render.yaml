# Render.com Blueprint — Campus Ride Share
# This file enables one-click deployment from GitHub to Render.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─────────────────────────────────────────
  # BACKEND — Node.js / Express API
  # ─────────────────────────────────────────
  - type: web
    name: campus-ride-share-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SENDER_EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false

  # ─────────────────────────────────────────
  # FRONTEND — React Static Site
  # ─────────────────────────────────────────
  - type: static
    name: campus-ride-share-frontend
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
